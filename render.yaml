services:
  # --------------------------------------------------
  # 1. FastAPI Backend Web Service
  # --------------------------------------------------
  - type: web
    name: tata-ai-backend
    runtime: python
    region: singapore
    plan: free
    buildCommand: "pip install -r backend/requirements.txt && python -m spacy download en_core_web_sm"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT --workers 1"
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: tata-ai-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.12.0

  # --------------------------------------------------
  # 2. React SPA Frontend (Static Site)
  # --------------------------------------------------
  - type: web
    name: tata-ai-frontend
    runtime: static
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "./frontend/dist"
    envVars:
      - key: VITE_API_BASE_URL
        value: https://tata-ai-backend-og7t.onrender.com

# --------------------------------------------------
# 3. Managed PostgreSQL Database
# --------------------------------------------------
databases:
  - name: tata-ai-db
    databaseName: tata_legal_db
    user: tata_admin
    region: singapore
    plan: free